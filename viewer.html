<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>claude-view</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Space+Grotesk:wght@600&family=Inter:wght@400;600;700&family=IBM+Plex+Sans:wght@600&family=IBM+Plex+Mono:wght@500&family=JetBrains+Mono:wght@400&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css@5/github-markdown.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11/styles/github.min.css" media="(prefers-color-scheme: light)">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11/styles/github-dark.min.css" media="(prefers-color-scheme: dark)">
<style>
  :root { color-scheme: light dark; --bg: #ffffff; --muted: #59636e; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0d1117; --muted: #9198a1; } }
  body { margin: 0; background: var(--bg); }
  .markdown-body { box-sizing: border-box; max-width: 900px; margin: 0 auto; padding: 48px 32px 96px; }
  .markdown-body pre code.hljs { padding: 0; background: transparent; }

  .markdown-body { font: 16px/1.7 "Inter", -apple-system, sans-serif; }
  .markdown-body code, .markdown-body pre { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 0.88em; }
  .markdown-body h1, .markdown-body h2, .markdown-body h3,
  .markdown-body h4, .markdown-body h5, .markdown-body h6 { line-height: 1.25; margin: 1.6em 0 0.6em; }
  .markdown-body h1 { font: 600 2.6em/1.15 "Fraunces", Georgia, serif; letter-spacing: -0.02em; padding-bottom: 0.3em; }
  .markdown-body h2 { font: 600 1.9em/1.2 "Space Grotesk", sans-serif; letter-spacing: -0.01em; padding-bottom: 0.25em; }
  .markdown-body h3 { font: 700 1.45em/1.3 "Inter", sans-serif; }
  .markdown-body h4 { font: 600 1.2em/1.35 "IBM Plex Sans", sans-serif; }
  .markdown-body h5 { font: 500 0.95em/1.4 "IBM Plex Mono", monospace; text-transform: uppercase; letter-spacing: 0.08em; }
  .markdown-body h6 { font: 500 0.85em/1.4 "IBM Plex Mono", monospace; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }
  .markdown-body > :first-child { margin-top: 0; }
  #status { position: fixed; top: 10px; right: 14px; font: 12px -apple-system, sans-serif; color: var(--muted); }
  @media (max-width: 600px) { .markdown-body { padding: 24px 16px 64px; } }
</style>
</head>
<body>
<div id="status">Waiting for /copy…</div>
<article id="content" class="markdown-body"></article>
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11/highlight.min.js"></script>
<script>
  const content = document.getElementById("content");
  const status = document.getElementById("status");
  let last = null;

  async function refresh() {
    try {
      const res = await fetch("response.md", { cache: "no-store" });
      if (!res.ok) return;
      const text = await res.text();
      if (text === last) return;
      last = text;
      content.innerHTML = DOMPurify.sanitize(marked.parse(text));
      content.querySelectorAll("pre code").forEach((el) => hljs.highlightElement(el));
      status.textContent = "Updated " + new Date().toLocaleTimeString();
    } catch {
      status.textContent = "claude-view stopped";
    }
  }

  refresh();
  setInterval(refresh, 700);
</script>
</body>
</html>
